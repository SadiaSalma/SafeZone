<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safety by area · SafeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container py-4">
    <h1 class="h3">Safety by area</h1>
    <div class="mb-4" style="max-width: 420px">
      <label for="area" class="form-label">Choose an area</label>
      <select id="area" class="form-select"></select>
    </div>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <div id="area-details" class="d-none">
      <h2 id="area-name" class="h4"></h2>
      <p id="area-station" class="text-secondary small"></p>

      <div class="row g-3 mb-3">
        <div class="col-sm-4">
          <div class="card card-body text-center">
            <div id="total" class="stat-number">0</div>
            <div class="small text-secondary">approved thefts in the last 30 days</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="card card-body text-center">
            <div id="top-type" class="fw-bold fs-5">–</div>
            <div class="small text-secondary">most common type</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="card card-body text-center">
            <div id="busy-hour" class="fw-bold fs-5">–</div>
            <div class="small text-secondary">busiest time of day</div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-lg-6">
          <div class="card card-body">
            <h3 class="h6">Thefts by type</h3>
            <canvas id="type-chart" aria-label="Bar chart of thefts by type" role="img"></canvas>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card card-body">
            <h3 class="h6">Thefts by hour of day</h3>
            <canvas id="hour-chart" aria-label="Bar chart of thefts by hour of day" role="img"></canvas>
          </div>
        </div>
      </div>

      <h3 class="h5">Latest alerts here</h3>
      <ul id="area-alerts" class="list-group mb-3"></ul>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/area.js"></script>
</body>
</html>
