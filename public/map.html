<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theft map · SafeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container py-4">
    <h1 class="h3">Theft map</h1>
    <p class="text-secondary">
      Approved thefts only. Each point is moved about 150 m, so nobody's exact place is shown.
    </p>
    <div class="row g-2 mb-3">
      <div class="col-sm-6 col-lg-4">
        <label for="type-filter" class="form-label small mb-1">Type of theft</label>
        <select id="type-filter" class="form-select"></select>
      </div>
      <div class="col-sm-6 col-lg-4">
        <label for="days-filter" class="form-label small mb-1">Time</label>
        <select id="days-filter" class="form-select">
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="365">Last year</option>
        </select>
      </div>
    </div>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <label class="form-label small mb-1" for="area-search">Find an area</label>
    <div class="input-group mb-1" style="max-width: 520px">
      <input id="area-search" class="form-control" list="area-names" autocomplete="off"
             placeholder="Search an area, for example Mirpur or ধানমন্ডি">
      <button id="area-search-button" type="button" class="btn btn-outline-primary">Find</button>
    </div>
    <datalist id="area-names"></datalist>
    <div id="area-search-note" class="form-text mb-2">Type an area to zoom the map to it.</div>
    <div id="theft-map" class="map"></div>
    <p id="map-count" class="small text-secondary mt-2"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/common.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/area-search.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
