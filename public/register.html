<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · SafeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container py-5" style="max-width: 420px">
    <h1 class="h3 mb-4">Create an account</h1>
    <form id="register-form" class="card card-body">
      <div class="mb-3">
        <label for="name" class="form-label">Your name</label>
        <input id="name" class="form-control" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Mobile number</label>
        <input id="phone" class="form-control" placeholder="01XXXXXXXXX" inputmode="tel" autocomplete="tel"
               pattern="01[3-9][0-9]{8}" title="11 digits, starting with 01" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" minlength="8" autocomplete="new-password"
               aria-describedby="password-hint" required>
        <div id="password-hint" class="form-text">At least 8 characters.</div>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="text-center mt-3">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
