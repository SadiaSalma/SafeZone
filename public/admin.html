<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · SafeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Admin</h1>
    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <div id="done" class="alert alert-success d-none" role="status"></div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#staff-tab" type="button" role="tab">Staff</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#reports-tab" type="button" role="tab">All reports</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#thanas-tab" type="button" role="tab">Thanas</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Staff: add a verifier and see everyone who can review. -->
      <section class="tab-pane fade show active" id="staff-tab" role="tabpanel">
        <form id="staff-form" class="card card-body mb-3">
          <h2 class="h6">Add a verifier</h2>
          <div class="row g-2">
            <div class="col-md-4">
              <label for="staff-name" class="form-label">Name</label>
              <input id="staff-name" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label for="staff-phone" class="form-label">Mobile number</label>
              <input id="staff-phone" class="form-control" placeholder="01XXXXXXXXX" required>
            </div>
            <div class="col-md-4">
              <label for="staff-password" class="form-label">First password</label>
              <input id="staff-password" type="password" class="form-control" minlength="8" required>
            </div>
          </div>
          <button class="btn btn-primary mt-3 align-self-start">Add verifier</button>
        </form>
        <div class="table-responsive">
          <table class="table bg-white">
            <thead><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Added</th></tr></thead>
            <tbody id="staff-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- All reports, every status. -->
      <section class="tab-pane fade" id="reports-tab" role="tabpanel">
        <div class="table-responsive">
          <table class="table table-hover bg-white">
            <thead><tr><th>Sent</th><th>Type</th><th>Thana</th><th>GD</th><th>Status</th><th>Note</th></tr></thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- Thanas: the address and phone can go out of date, so admins can fix them. -->
      <section class="tab-pane fade" id="thanas-tab" role="tabpanel">
        <div class="table-responsive">
          <table class="table align-middle bg-white">
            <thead><tr><th>Thana</th><th>Address</th><th>Phone</th><th></th></tr></thead>
            <tbody id="thana-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
