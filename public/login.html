<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · SafeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container py-5" style="max-width: 420px">
    <h1 class="h3 mb-4">Log in to SafeZone</h1>
    <form id="login-form" class="card card-body">
      <div class="mb-3">
        <label for="phone" class="form-label">Mobile number</label>
        <input id="phone" class="form-control" placeholder="01XXXXXXXXX" inputmode="tel" autocomplete="tel" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="text-center mt-3">New here? <a href="register.html">Create an account</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
